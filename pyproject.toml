[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symphonium-disc-maker"
version = "0.1.0"
description = "Generate SVG/DXF discs and label layouts for a 20-note Mr. Christmas Symphonium"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Richard Harris"}
]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9", "matplotlib>=3.6"]
print = ["matplotlib>=3.6"]

[project.scripts]
symphonium-disc = "symphonium_disc_maker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
